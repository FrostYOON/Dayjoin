# Generated with Supabase CLI 2.118.0; reduced to the local Auth stack.
# Business data remains in Compose PostgreSQL, managed only by Prisma.
project_id = "dayjoin-auth"
[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
auto_expose_new_tables = false
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = false
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55434
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/callback", "http://127.0.0.1:5175/auth/callback", "http://127.0.0.1:4180/auth/callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 1800
[auth.rate_limit]
# Local captured mail only; production quotas must be configured separately.
email_sent = 100
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
[edge_runtime]
enabled = false
[analytics]
enabled = false
