<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dayjoin · 화면을 불러올 수 없어요</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7f2; color: #302c29; }
      main { max-width: 28rem; padding: 2rem; line-height: 1.7; }
      h1 { font-size: 1.5rem; line-height: 1.4; }
      .brand { color: #9e5141; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #252322; color: #f3eae1; } .brand { color: #f0b5a1; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Dayjoin</p>
      <h1>화면을 불러올 수 없어요</h1>
      <p>앱을 종료한 뒤 다시 열어 주세요.</p>
      <p>Android에서는 Android System WebView와 Chrome이 최신 버전인지 확인해 주세요. iPhone에서는 iOS 업데이트를 확인해 주세요.</p>
      <p>계속 같은 화면이 보이면 앱 업데이트 후 다시 시도해 주세요.</p>
    </main>
  </body>
</html>
